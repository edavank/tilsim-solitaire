name: Tilsim S2 - Android compatibility build

on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android with the same S2 fixes
    type: build
    params:
      platform: android
      profile: qa
      message: S2 TEST - Android rewards and cloud save checks
    hooks:
      after_install_node_modules:
        - name: Check shared critical behavior
          run: |
            node --test scripts/test-*.cjs
